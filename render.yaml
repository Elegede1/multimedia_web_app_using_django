databases:
  - name: multimedia_db
    databaseName: multimedia_website
    user: multimedia_user

services:
  - type: web
    name: multimedia_website
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn multimedia_website.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multimedia_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
